name: Ruby
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Ruby
      uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Run unit tests + verifiers (prepush gate)
      run: bundle exec rake prepush
    - name: Run liquid-spec against reference adapter
      run: bundle exec rake run
    - name: Checkout range resource-limit reference
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        repository: Shopify/liquid
        ref: cdba4e9137d50e3a4a8f714d383e6c704a809bd1
        path: liquid-range-reference
    - name: Run staged range resource-limit specs against candidate
      env:
        LIQUID_RANGE_REFERENCE_PATH: ${{ github.workspace }}/liquid-range-reference
      run: >-
        bundle exec ruby -Ilib bin/liquid-spec run ci/liquid_ruby_range_resource_limits.rb
        -s basics
        -n '^(for_dynamic_range_empty_body_charges_each_item|tablerow_literal_range_empty_body_charges_each_item|for_literal_range_reversed_offset_limit_keeps_metadata|tablerow_literal_range_offset_limit_keeps_metadata|range_score_is_cumulative_across_isolated_render_partials|tablerow_capture_output_respects_assign_score_limit|tablerow_break_final_markup_respects_render_length_limit|for_nonempty_range_at_render_score_boundary|for_nonempty_range_over_render_score_boundary|for_offset_range_does_not_charge_skipped_items)$'
        --no-max-failures
    - name: Check feature tag coverage
      run: bundle exec rake coverage_check

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Ruby
      uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Build gem
      run: bundle exec rake build
    - name: Publish to RubyGems
      run: |
        mkdir -p $HOME/.gem
        printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > $HOME/.gem/credentials
        chmod 0600 $HOME/.gem/credentials
        gem push build/liquid-spec-*.gem
      env:
        RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: build/liquid-spec-*.gem
