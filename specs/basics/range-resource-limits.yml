_metadata:
  hint: |
    Regression coverage for bounded range iteration's resource-limit accounting.
    These cases require the post-5.13 range resource-limit implementation in
    addition to Shopify resource-limit support.
  complexity: 500
  features:
    - shopify_resource_limits
    - range_resource_limits

specs:
- name: for_dynamic_range_empty_body_charges_each_item
  complexity: 500
  template: "{% for i in (first..last) %}{% endfor %}"
  environment:
    first: 1
    last: 3
  error_mode: [strict2, strict]
  render_errors: false
  resource_limits:
    render_score_limit: 3
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    The root loop tag costs one render-score unit and its three yielded values
    cost three more, even when the body is empty. Dynamic bounds must use the
    same accounting as a literal range, so the four-unit loop exceeds 3.

- name: tablerow_literal_range_empty_body_charges_each_item
  complexity: 501
  template: "{% tablerow i in (1..3) %}{% endtablerow %}"
  error_mode: [strict2, strict]
  render_errors: false
  resource_limits:
    render_score_limit: 3
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    tablerow also charges its tag plus every range item before rendering the
    body. Empty cells still consume work, so the fourth unit exceeds this
    render-score limit.

- name: for_literal_range_reversed_offset_limit_keeps_metadata
  complexity: 502
  template: "{% for i in (1..10) reversed offset:7 limit:2 %}{{ forloop.length }}:{{ forloop.index }}:{{ i }}{% endfor %}"
  expected: "2:1:92:2:8"
  hint: |
    Apply offset and limit to the range segment without materializing it, then
    reverse that segment. forloop.length and forloop.index describe the two
    selected values (9 and 8), not the original ten-item range.

- name: tablerow_literal_range_offset_limit_keeps_metadata
  complexity: 503
  template: "{% tablerow i in (1..10) offset:7 limit:2 %}{{ tablerowloop.length }}:{{ tablerowloop.index }}:{{ i }}{% endtablerow %}"
  expected: |
    <tr class="row1">
    <td class="col1">2:1:8</td><td class="col2">2:2:9</td></tr>
  hint: |
    tablerow selects a bounded range segment before generating markup. Its
    loop metadata reports the two selected values (8 and 9), including their
    one-based indexes, rather than the full range length.

- name: range_score_is_cumulative_across_isolated_render_partials
  complexity: 504
  template: "{% render 'range_loop' %}{% render 'range_loop' %}"
  error_mode: [strict2, strict]
  render_errors: false
  filesystem:
    range_loop.liquid: "{% for i in (1..2) %}{% endfor %}"
  resource_limits:
    cumulative_render_score_limit: 5
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    render creates an isolated Liquid context, but its work contributes to the
    caller's cumulative render score. Two empty two-item range loops cost more
    than 5 together even though neither partial has its own per-render limit.

- name: tablerow_capture_output_respects_assign_score_limit
  complexity: 505
  template: "{% capture table %}{% tablerow i in (1..2) %}{{ i }}{% endtablerow %}{% endcapture %}"
  error_mode: [strict2, strict]
  render_errors: false
  resource_limits:
    assign_score_limit: 69
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    Capturing tablerow's generated HTML adds all 70 bytes to assign score even
    though capture emits no final output. The limit is checked against the
    complete generated table, not just the tag body.

- name: tablerow_break_final_markup_respects_render_length_limit
  complexity: 506
  template: "{% tablerow i in (1..3) %}{{ i }}{% break %}{% endtablerow %}"
  error_mode: [strict2, strict]
  render_errors: false
  resource_limits:
    render_length_limit: 46
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    break stops further cells but tablerow must still close the current cell
    and row. The resulting 47-byte final markup is subject to the render
    length limit, so a limit of 46 raises a memory error.

- name: for_nonempty_range_at_render_score_boundary
  complexity: 507
  template: "{% for i in (1..3) %}{{ i }}{% endfor %}"
  resource_limits:
    render_score_limit: 7
  expected: "123"
  hint: |
    A three-item range loop with one rendered node per item costs seven render
    score units: one loop tag, three yielded values, and three body renders.
    The exact boundary succeeds and produces all three values.

- name: for_nonempty_range_over_render_score_boundary
  complexity: 508
  template: "{% for i in (1..3) %}{{ i }}{% endfor %}"
  error_mode: [strict2, strict]
  render_errors: false
  resource_limits:
    render_score_limit: 6
  errors:
    render_error:
      - Memory limits exceeded
  hint: |
    The same seven-unit nonempty range loop must raise when the render-score
    limit is six. Check every yielded value and body render against the limit.

- name: for_offset_range_does_not_charge_skipped_items
  complexity: 509
  template: "{% for i in (1..10) offset:7 limit:2 %}{{ i }}{% endfor %}"
  resource_limits:
    render_score_limit: 5
  expected: "89"
  hint: |
    Offset and limit select only 8 and 9 from this bounded native integer
    range. Their five score units are the loop tag, two selected values, and
    two body renders; the seven skipped values must not be charged.
